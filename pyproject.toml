[project]
name = "maeva-deal-radar-v2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ARECIE SG", email = "flansway@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.50.0",
    "feedparser>=6.0.0",
    "httpx>=0.27.0",
    "lancedb>=0.20.0",
    "mcp[cli]>=1.27.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.0.0",
]

[project.scripts]
maeva-deal-radar-v2 = "maeva_deal_radar_v2:main"

[build-system]
requires = ["uv_build>=0.9.29,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
]
ignore = [
    "E501",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "sentence_transformers.*",
    "torch.*",
    "lancedb.*",
    "pyarrow.*",
    "feedparser.*",
]
ignore_missing_imports = true
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
